name: Build and publish backend

on:
  push:
    branches: [main]
    paths:
      - 'final-submission/backend/**'
      - 'final-submission/Dockerfile'
      - 'final-submission/.dockerignore'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [main]
    paths:
      - 'final-submission/backend/**'
      - 'final-submission/Dockerfile'
      - 'final-submission/.dockerignore'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: mikoladolia/dan-it-backend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./final-submission
          file: ./final-submission/Dockerfile
          platforms: linux/amd64
          load: true
          tags: backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify HTTP response and container user
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name backend-smoke -p 127.0.0.1:8000:8000 backend:test
          trap 'docker logs backend-smoke; docker stop --timeout 2 backend-smoke' EXIT
          test "$(docker exec backend-smoke id -u)" = "10001"
          python3 - <<'PY'
          import json
          import subprocess
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          for attempt in range(30):
              try:
                  with urlopen("http://127.0.0.1:8000/healthz", timeout=2) as response:
                      assert response.status == 200
                      assert response.headers.get_content_type() == "application/json"
                      assert json.load(response) == {"status": "ok"}
                  break
              except (URLError, ConnectionError, TimeoutError):
                  time.sleep(0.5)
          else:
              raise RuntimeError("Backend did not become ready")

          info = json.loads(subprocess.check_output(["docker", "inspect", "backend-smoke"]))[0]
          container_ip = next(iter(info["NetworkSettings"]["Networks"].values()))["IPAddress"]
          with urlopen("http://127.0.0.1:8000/", timeout=2) as response:
              assert response.status == 200
              assert response.headers.get_content_type() == "text/html"
              html = response.read().decode("utf-8")
              assert "DevOps Control Plane" in html
          with urlopen("http://127.0.0.1:8000/api/status", timeout=2) as response:
              assert response.status == 200
              payload = json.load(response)
          assert payload["status"] == "ok", payload
          assert payload["service"] == "dan-it-backend", payload
          assert payload["ip"] == container_ip, payload
          print("GET / -> dashboard HTTP 200")
          print("GET /api/status ->", payload)
          try:
              urlopen("http://127.0.0.1:8000/missing", timeout=2)
              raise AssertionError("Expected HTTP 404")
          except HTTPError as error:
              assert error.code == 404
              print("GET /missing -> HTTP 404")
          PY

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./final-submission
          file: ./final-submission/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      - name: Write publication summary
        if: steps.publish.outcome == 'success'
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo '## Published Docker image'
            echo "- Image: ${IMAGE_NAME}"
            echo "- Tags: latest, sha-${GITHUB_SHA}"
            echo "- Digest: ${IMAGE_DIGEST}"
            echo '- Checks passed: dashboard, health API, container IP, HTTP 404, UID 10001.'
          } >> "$GITHUB_STEP_SUMMARY"

  update-gitops:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Commit published image to GitOps
        shell: bash
        run: |
          set -euo pipefail
          # Never deploy a superseded build, including a rerun of an old workflow.
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          if ! git diff --quiet "$GITHUB_SHA" HEAD -- \
            final-submission/backend final-submission/Dockerfile \
            final-submission/.dockerignore .github/workflows/docker-publish.yml; then
            echo 'Skipped: main already contains newer build inputs.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("final-submission/k8s/deployment.yaml")
          text = path.read_text(encoding="utf-8")
          tag = "sha-" + os.environ["GITHUB_SHA"]
          image = os.environ["IMAGE_NAME"] + ":" + tag
          text, images = re.subn(
              r"(?m)^(\s*- name: backend\n\s*image: )\S+$",
              lambda match: match[1] + image, text,
          )
          text, versions = re.subn(
              r"(?m)^(\s*- name: APP_VERSION\n\s*value: )\S+$",
              lambda match: match[1] + tag, text,
          )
          if images != 1 or versions != 1:
              raise SystemExit("Expected exactly one backend image and APP_VERSION; no file written")
          path.write_text(text, encoding="utf-8")
          PY
          git add -- final-submission/k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo 'Deployment already references this image.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "deploy: backend sha-${GITHUB_SHA}"
          # A concurrent push causes a visible failure; never force-push or rebase a stale image.
          git push origin HEAD:main
          echo "GitOps commit: $(git rev-parse HEAD); image: ${IMAGE_NAME}:sha-${GITHUB_SHA}. Await ArgoCD sync." >> "$GITHUB_STEP_SUMMARY"
